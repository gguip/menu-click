# Deploy da API do MenuClick no Render (plano gratuito). Roteiro completo, com
# as contas e o DNS, em docs/deploy.md. Segredos (sync: false) são pedidos
# pelo Render na criação e NUNCA ficam neste arquivo (S12).
services:
  - type: web
    name: menuclick-api
    runtime: node
    plan: free
    # perto do Neon (AWS us-east-1): API e banco no mesmo lado do oceano
    region: virginia
    rootDir: ./
    # `corepack pnpm`, não `corepack enable`: o enable troca o atalho
    # /usr/bin/pnpm, e no Render /usr é só leitura (EROFS no primeiro deploy)
    buildCommand: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile --filter "@menuclick/api..."
    # migrations antes do listen: uma instância só, sem subida concorrente
    # (o gancho de pré-deploy do Render é pago). Direto pelo node, sem pnpm:
    # não depende dos atalhos do corepack existirem na hora de rodar, e o
    # SIGTERM do Render chega ao Node sem intermediário (F26). As variáveis
    # vêm do Render, então o --env-file dos scripts não faz falta
    startCommand: cd apps/api && node src/db/migrate.ts up && node src/server.ts
    healthCheckPath: /health
    # publica só depois do CI verde no GitHub
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "false"
      # o Render fica atrás do Cloudflare, que sobrescreve este header na borda
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: CORS_ORIGINS
        value: https://menuclick.gguip.dev,https://painel.menuclick.gguip.dev
      - key: MENU_BASE_URL
        value: https://menuclick.gguip.dev
      - key: EMAIL_DRIVER
        value: smtp
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        value: MenuClick <menuclick@gguip.dev>
      - key: PASSWORD_RESET_URL
        value: https://painel.menuclick.gguip.dev/recuperar-senha
      - key: EMAIL_VERIFICATION_URL
        value: https://painel.menuclick.gguip.dev/verificar-email
